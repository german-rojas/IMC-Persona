<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC - Rojas Gallardo Germán René 2-4</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            padding-top: 50px;
        }
        
        .contenedor {
            background-color: #ffffff;
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 300px;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
            color: #555;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #218838;
        }

        #resultado {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
            color: #222;
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <h2>Calculadora de IMC - Rojas Gallardo Germán René 2-4</h2>

        <label for="txtPeso">Peso en kg:</label>
        <input type="number" id="txtPeso" placeholder="Ej: 70">

        <label for="txtAltura">Altura en metros:</label>
        <input type="number" step="0.01" id="txtAltura" placeholder="Ej: 1.75">

        <button id="btnCalcular">Calcular IMC</button>

        <p id="resultado"></p>
    </div>

    <script>
        // Obtener el boton
        let boton = document.getElementById("btnCalcular");

        // Hacer clic en el boton
        boton.addEventListener("click", function() {
            // Leer los datos que puso el usuario
            let peso = parseFloat(document.getElementById("txtPeso").value);
            let altura = parseFloat(document.getElementById("txtAltura").value);

            // Validar que si hayan puesto numeros y que la altura no sea cero
            if (isNaN(peso) || isNaN(altura) || altura <= 0) {
                document.getElementById("resultado").textContent = "Por favor ingresa valores válidos.";
            } else {
                // Calcular el IMC
                let imc = peso / (altura * altura);
                let clasificacion = "";

                // Evaluar los rangos con if/else
                if (imc < 18.5) {
                    clasificacion = "Bajo peso";
                } else if (imc >= 18.5 && imc < 25) {
                    // Poner < 25 para cubrir hasta el 24.999...
                    clasificacion = "Normal";
                } else if (imc >= 25 && imc < 30) {
                    clasificacion = "Sobrepeso";
                } else {
                    clasificacion = "Obesidad";
                }

                // Redondear a 2 decimales para que salga como en el ejemplo de salida esperada: 22.86
                let imcRedondeado = imc.toFixed(2);

                // Mostrar el resultado final
                document.getElementById("resultado").textContent = "IMC: " + imcRedondeado + ", Clasificación: " + clasificacion + ".";
            }
        });
    </script>

</body>
</html>
